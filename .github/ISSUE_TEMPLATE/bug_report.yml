name: Bug report
description: Help improve Almira by reporting something that did not work.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: 'Share reproducible steps. Keep passwords, API keys, email addresses and private wardrobe photos out of this public report.'
  - type: input
    id: page
    attributes:
      label: Page or action
      placeholder: 'Wardrobe → Add item'
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the exact error text, if any.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: 'Android / Chrome, iPhone / Safari, Windows / Edge'
    validations:
      required: true
  - type: dropdown
    id: account
    attributes:
      label: Account mode
      options:
        - Guest
        - Signed in
        - During signup or login
        - Unsure
    validations:
      required: true
  - type: input
    id: deployment
    attributes:
      label: App link or deployment version
      description: Use the normal app URL; remove any login codes or tokens from it.
  - type: textarea
    id: screenshot
    attributes:
      label: Optional screenshot
      description: Crop or hide personal information before attaching.
